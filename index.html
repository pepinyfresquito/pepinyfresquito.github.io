* {

}

body {
  margin: 0;
  padding: 0;

}

/* PORTADA ORIGINAL */
.portada {
  display: block;
  width: 100%;
  height: auto;
  max-height: 100vh;
  object-fit: contain;
  background: #08265f;
}

/* FRANJA DE BOTONES */
.botones {
  width: 100%;
  background: linear-gradient(
    135deg,
    #061e52,
    #17458f
  );
  padding: 45px 20px 55px;
  display: flex;
  justify-content: center;
  align-items: stretch;
  gap: 22px;
  flex-wrap: wrap;
}

/* BOTONES */
.boton {
  background: white;
  color: #123b85;
  border: 4px solid #d32639;
  border-radius: 22px;
  padding: 24px 18px;
  width: 270px;
  min-height: 125px;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;

  text-align: center;
  text-decoration: none;
  font-size: 20px;
  font-weight: bold;

  box-shadow: 0 8px 20px #0003;
  transition: 0.2s;
}

.boton:hover {
  background: #eaf5ff;
  transform: translateY(-3px);
}

.simbolo {
  font-size: 34px;
  color: #c82136;
}

/* BOTONES PENDIENTES DE ACTIVAR */
.inactivo {
  cursor: default;
}

/* PIE */
footer {
  background: #061e52;
  color: white;
  text-align: center;
  padding: 20px;
  font-size: 13px;
}

/* ADAPTACIÓN A MÓVILES */
@media (max-width: 600px) {
  .botones {
    padding: 25px 15px;
    gap: 15px;
  }

  .boton {
    width: 100%;
    min-height: 90px;
  }
}
</style>
